name: Deploy code to Databricks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest pyspark
      - name: Run tests
        run: python -m pytest testcases/ -v
      - uses: databricks/setup-cli@main
      - name: Copy code to Databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          USER_NAME="$(databricks current-user me --output json | jq -r .userName)"
          databricks sync . "/Users/${USER_NAME}/Pytest-CICD"